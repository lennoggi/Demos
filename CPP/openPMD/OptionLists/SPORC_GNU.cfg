# ******************************************************************************
# Load the openPMD library:
#      spack env activate ccrg-le8016-x86_64-24083001
# ******************************************************************************

# For some reason compiling with just g++ doesn't work (MPI-related library not found)
CXX      = mpicxx
CXXFLAGS = -std=c++17

LDFLAGS = -rdynamic

OPTIMIZE           = yes
CXX_OPTIMIZE_FLAGS = -pipe -march=skylake -malign-double -Ofast

WARN           = yes
CXX_WARN_FLAGS = -Wall

DEBUG           = no
CXX_DEBUG_FLAGS = -g3

OPENPMD_INC_DIR  = /.autofs/tools/spack/var/spack/environments/ccrg-le8016-x86_64-24083001/.spack-env/view/include
OPENPMD_LIBS_DIR = /.autofs/tools/spack/var/spack/environments/ccrg-le8016-x86_64-24083001/.spack-env/view/lib64
OPENPMD_LIBS     = -lopenPMD
